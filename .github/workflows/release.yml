name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Run releases one at a time; never cancel an in-flight publish.
concurrency:
  group: release
  cancel-in-progress: false

# Repo-level default: no permissions. The job opts in explicitly.
permissions: {}

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the "Version Packages" PR branch and git tags
      pull-requests: write # open/update the version PR
      id-token: write # npm trusted publishing (OIDC + provenance)

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm trusted publishing (OIDC) needs npm >= 11.5.1. Node 24's bundled npm
      # may be older, so install an explicit, SHA-pinned-equivalent version
      # rather than a floating `@latest` that could regress between runs.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      # changesets/action does one of two things on every push to main:
      #   - changesets present  -> open/update the "Version Packages" PR (runs `version`)
      #   - no changesets present (version PR merged) -> publish to npm (runs `publish`)
      - name: Create Version PR or Publish to npm
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trusted publishing via OIDC — no NPM_TOKEN needed. Provenance is
          # attached automatically. Configure the trusted publisher for
          # @joycostudio/trazo on npmjs.com (repo joyco-studio/trazo, this
          # workflow file). To use a classic token instead, drop id-token:write
          # above and set NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} here.
          NPM_CONFIG_PROVENANCE: "true"
